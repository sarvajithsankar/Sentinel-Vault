services:
  cpp-engine:
    build:
      context: .
      dockerfile: src/Dockerfile
    volumes:
      - ./data:/app/data
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
